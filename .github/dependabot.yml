# Monthly dependency PRs, grouped so each ecosystem opens ONE PR per run
# instead of one per crate (an ungrouped first run opens a dozen PRs at once,
# each running the full CI matrix including the e2e job).
# `rebase-strategy: disabled` matters as much as the grouping: by default
# Dependabot rebases every open PR on each push to main, and each rebase
# re-runs the whole matrix. Rebase by hand (`@dependabot rebase`) when a PR
# actually needs it.
# MDK is a git-rev dependency and is deliberately NOT covered here — bumping
# it is a reviewed, CHANGELOG-driven step (see the comment block above the MDK
# entries in the root Cargo.toml).
# The actions in cli-release.yml are generated by cargo-dist from the SHAs in
# dist-workspace.toml (`[dist.github-action-commits]`): a Dependabot bump of
# that file alone fails its own `plan` check until the same SHA is put in
# dist-workspace.toml and `dist generate` is re-run.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    # `nostr` must match MDK's own pin exactly (root Cargo.toml comment) — a
    # Dependabot bump to a different minor/major would fork the dependency
    # graph away from what MDK was built against. Patch bumps within 0.44.x
    # are fine; MDK bumps carry the rest.
    ignore:
      - dependency-name: nostr
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: nostr-sdk
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      tauri-minor-patch:
        update-types: [minor, patch]
      tauri-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
