# Desktop release pipeline (Tauri 2 shell over the moyu-cli sidecar).
#
# Triggers on `app-v*` tags — deliberately disjoint from cli-release.yml's
# `dist-workspace.toml` `tag-namespace = "cli"` (which matches `cli/v*`). The
# two patterns must never overlap, or one tag would release twice.
#
# `workflow_dispatch` is a manual build-only entry point (nothing is
# uploaded); its `legs=macos` input builds just the two macOS legs.
#
# Runners: every leg runs on a GitHub-hosted runner. This repository has no
# self-hosted runners and must not get one — a public repository's workflows
# can be triggered by anyone's pull request.
#
# Two stages, so no write token ever sits next to third-party code:
#   - `publish-tauri` builds every leg with a read-only token. It runs
#     `pnpm install` and compiles every crate's build script, so it must not
#     hold anything that could push to this repository. tauri-action runs in
#     its build-only mode and the installers leave the job as artifacts.
#   - `release` holds `contents: write`, runs no project code and installs
#     nothing: it downloads the artifacts and creates ONE draft GitHub
#     Release in this repository. It only runs when every leg succeeded, so
#     a draft never has a platform missing, and one job creating the draft
#     avoids the multi-leg check-then-create race (tauri-apps/tauri-action#914).
#
# RUSTFLAGS: never set globally here. The root .cargo/config.toml pins an
# 8 MiB Windows link-arg via target-scoped rustflags (moyu.exe stack-overflows
# on MSVC's 1 MiB default otherwise); a global RUSTFLAGS env var would
# silently override it. See .cargo/config.toml's own comment.
name: Release Desktop

on:
  push:
    tags:
      # Exact-release tags only. Prerelease suffixes (app-v0.1.0-rc1) are
      # deliberately NOT matched: version-check would hard-fail any suffix and
      # `prerelease: false` is hardcoded below, so v1 simply doesn't support
      # prereleases end-to-end — better to not trigger than to fail late.
      - 'app-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      legs:
        description: "Matrix legs to build (build-only): all, or just the macOS legs"
        type: choice
        options: [all, macos]
        default: all

# Read-only by default; only the `release` job widens this.
permissions:
  contents: read

jobs:
  # Fails fast, before the build matrix starts, if the pushed tag doesn't
  # match the app version (tag version must equal tauri.conf.json's), and
  # emits the build matrix (trimmed to the macOS legs on `legs=macos`).
  plan:
    name: tag == tauri.conf.json version / matrix
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag to tauri.conf.json version
        id: check
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#app-v}"
          conf_version="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          echo "tag=$tag tag_version=$tag_version conf_version=$conf_version"
          if [ "$tag_version" != "$conf_version" ]; then
            echo "::error::tag $tag (version $tag_version) does not match apps/desktop/src-tauri/tauri.conf.json version $conf_version"
            exit 1
          fi
          echo "version=$conf_version" >> "$GITHUB_OUTPUT"

      # The matrix lives here (not in `strategy.matrix`) so workflow_dispatch
      # can trim it. Every leg is a native build on a GitHub-hosted runner:
      # - macos-aarch64: macos-14 (Apple Silicon).
      # - macos-x64: macos-15-intel. GitHub has announced that hosted Intel
      #   macOS goes away when the macOS 15 image retires (~Fall 2027);
      #   before then this leg has to become a cross build on an arm64
      #   runner (scripts/build-sidecar.mjs already takes
      #   MOYU_SIDECAR_TARGET for that) or be dropped.
      # - linux-x64: ubuntu-22.04 (glibc floor, same pin as cargo-dist).
      # - windows-x64: pinned windows-2022 — the only image the vendored
      #   SQLCipher+OpenSSL MSVC C stack has been CI-validated on
      #   (dist-workspace.toml and ci.yml pin the same); `windows-latest`
      #   would silently roll to newer images the release was never
      #   validated against.
      - name: Select matrix legs
        id: matrix
        env:
          LEGS: ${{ inputs.legs || 'all' }}
        run: |
          all='[
            {"platform":"macos-14","os_name":"macos-aarch64"},
            {"platform":"macos-15-intel","os_name":"macos-x64"},
            {"platform":"ubuntu-22.04","os_name":"linux-x64"},
            {"platform":"windows-2022","os_name":"windows-x64"}
          ]'
          if [ "$LEGS" = "macos" ]; then
            include="$(jq -c '[.[] | select(.os_name | startswith("macos"))]' <<<"$all")"
          else
            include="$(jq -c '.' <<<"$all")"
          fi
          echo "legs=$LEGS include=$include"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: build (${{ matrix.os_name }})
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml (repo root) pins 1.97.1 + rustfmt + clippy.
      # rustup resolves toolchain files by walking up from CWD regardless of
      # cargo workspace boundaries, so this also covers builds run inside
      # apps/desktop/src-tauri (its own, separate cargo workspace) — same
      # pattern ci.yml already relies on.
      - name: Install pinned toolchain
        run: rustup show

      # No Swatinem/rust-cache here, on purpose: a cache can be written by
      # any workflow run on the default branch and would then be restored
      # into the job that produces the shipped binaries. Release builds
      # start cold and compile everything from the locked sources.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/desktop-linux-deps
        with:
          # patchelf/xdg-utils are needed for AppImage/deb bundling
          # (tauri-action's Linux bundler) — ci.yml's desktop job only runs
          # clippy/typecheck there, so it doesn't need them. That gap is why
          # the two apt lists drifted apart before this composite action
          # existed; now it's an explicit, named difference instead of a
          # silent one.
          extra-packages: "patchelf xdg-utils"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # No `cache: pnpm`, for the same reason as no rust-cache above: the
        # shipped installers are built from a cold, lockfile-verified install.
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Native per-runner build (no cross-compiling): sidecar and GUI are
      # built from the same commit, so their versions can never drift
      # (scripts/build-sidecar.mjs stages the release binary as
      # binaries/moyu-<host-triple>[.exe]).
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs

      # Every action in this workflow is pinned to a commit SHA: a moved tag
      # must not be able to swap the code that builds the shipped installers.
      # No tagName / releaseId and no token: tauri-action only builds.
      - name: Build (tauri-action, build-only)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          # No code signing yet (mac notarization / Windows Authenticode both
          # deferred, see docs/desktop-install.md) — nothing to configure
          # here for that.

      # Exactly the bundle formats tauri.conf.json enables (dmg, deb,
      # appimage, nsis); `**` covers both target/release and
      # target/<triple>/release.
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: create draft release
    needs: [plan, publish-tauri]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts

      # A draft, so a human checks the installers before anyone can download
      # them. Publish with `--latest=false` (docs/release.md): the CLI's
      # `releases/latest/download/...` installer URLs must keep resolving to
      # the CLI release.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          printf '%s\n' "${files[@]}"
          count() { printf '%s\n' "${files[@]}" | grep -c -- "$1" || true; }
          if [ "$(count '\.dmg$')" -ne 2 ] || [ "$(count '\.deb$')" -ne 1 ] \
             || [ "$(count '\.AppImage$')" -ne 1 ] || [ "$(count '-setup\.exe$')" -ne 1 ]; then
            echo "::error::expected 2 dmg, 1 deb, 1 AppImage and 1 setup.exe"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "moyu desktop $VERSION" \
            --notes 'See the assets below to download and install moyu desktop.' \
            "${files[@]}"
