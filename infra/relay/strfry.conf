##
## Self-hosted Marmot relay — strfry config (see docs/self-host-relay.md).
## Only carries Marmot traffic; policy enforced by the moyu-relay-policy plugin.
##
db = "/var/lib/strfry/db"

relay {
    bind = "127.0.0.1"     # Caddy terminates TLS and proxies to this
    port = 7777
    nofiles = 1000000

    # Behind Caddy (relay binds loopback), trust the proxy's forwarded client
    # IP so the writePolicy plugin's per-IP rate limiting (kinds 445/1059) sees
    # real clients, not 127.0.0.1. Caddy sets X-Forwarded-For by default; strfry
    # listens only on loopback so this header is not externally spoofable.
    realIpHeader = "X-Forwarded-For"

    info {
        # Fill these in for your deployment (NIP-11). Do not advertise this
        # relay as moyu-operated: moyu runs no relay; this is yours.
        name = "your-relay-name"
        description = "Self-hosted relay for Marmot/MLS traffic only."
        pubkey = ""
        contact = ""
    }

    writePolicy {
        # The Rust plugin: kind allowlist + per-class rate limiting.
        plugin = "/usr/local/bin/moyu-relay-policy"
    }
}

# Event-level limits. Per strfry's schema these live in a top-level `events`
# block, NOT inside `relay { }` (where they'd silently fall back to defaults —
# maxEventSize default 65536 is half our intended cap).
events {
    ephemeralEventsLifetimeSeconds = 300
    maxEventSize = 131072
}
